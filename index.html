  function dynamicAdvice(role, result) {
    const advice = [];
    const stats = result.stats;

    if (role.id === 'seeker') {
      if (stats.contacts < 35) {
        advice.push('Ты почти не выходил к людям. Одно сообщение в Сетке может заменить двадцать откликов. Напиши не «ищу работу», а «помоги разобраться».');
      } else {
        advice.push('Ты использовал контакты. Продолжай: люди помнят не резюме, а разговор.');
      }
      if (stats.energy < 35) {
        advice.push('Энергия на нуле. Отдых — не награда за продуктивность, а условие для неё. Начни с одного дня без вакансий.');
      } else if (stats.fire < 35) {
        advice.push('Ты сильно себя обесценил. Отказ — это решение одной компании, а не оценка тебя. Верни в резюме три вещи, которые у тебя получились.');
      } else {
        advice.push('Ты сохранил контакт с собой. Это редкость на рынке. Не теряй его в первый же месяц на новой работе.');
      }
    } else {
      if (stats.trust < 40) {
        advice.push('Кандидаты не почувствовали ясности. Доверие теряется на мелочах: не ответить, перенести встречу, забыть про обратную связь.');
      } else {
        advice.push('Ты держал контакт с людьми. В найме это важнее скорости.');
      }
      if (stats.time < 35) {
        advice.push('Ты почти не оставил времени на людей. Найм — это не только воронка. Иногда один разговор стоит трёх часов сортировки.');
      }
      if (stats.culture < 40) {
        advice.push('Культура — это то, что ты делаешь, когда никто не смотрит. Кандидаты смотрят.');
      } else {
        advice.push('Ты помнил, что за резюме — человек. Это главный навык нанимателя.');
      }
    }
    return advice;
  }

  function render(opts = {}) {
    document.body.classList.toggle('is-landing', screen === 'landing');
    updateSoundButton();

    if (screen === 'landing') {
      renderLanding();
      document.title = 'Точка контакта — игра о поиске работы и людях';
    } else if (screen === 'game') {
      renderGame();
      const role = state ? ROLES[state.mode] : null;
      document.title = role ? `${role.label} · Точка контакта` : 'Точка контакта';
    } else if (screen === 'result') {
      renderResult();
      document.title = lastResult ? `${lastResult.ending.title} · Точка контакта` : 'Точка контакта';
    }

    if (opts.scroll) {
      window.scrollTo({ top: 0, behavior: reduceMotion() ? 'auto' : 'smooth' });
    }
    if (opts.focus) {
      const element = $(opts.focus);
      if (element) element.focus({ preventScroll: true });
    }
  }

  /* ------------------------------------------------------------
     actions
  ------------------------------------------------------------ */
  function chooseOption(optionId) {
    if (!state || state.pending) return;
    const level = currentLevel();
    const step = currentStep();
    if (!level || !step || !step.options) return;
    const option = step.options.find((item) => item.id === optionId);
    if (!option) return;

    applyEffects(option.effects);
    state.quality += option.quality;
    state.history.push({
      level: level.title,
      short: option.short || option.text,
      quality: option.quality,
      effects: option.effects || {}
    });

    state.pending = {
      type: 'choice',
      quality: option.quality,
      effects: option.effects || {},
      resultText: option.result,
      isLastStep: !level.steps || state.stepIndex >= level.steps.length - 1
    };

    persist();
    sfx(option.quality > 0 ? 'good' : option.quality < 0 ? 'bad' : 'click');
    render({ focus: '.result-panel' });
  }

  function nextStep() {
    if (!state || !state.pending) return;
    const level = currentLevel();
    if (!level) return;

    if (state.pending.type === 'choice' && level.steps && state.stepIndex < level.steps.length - 1) {
      state.stepIndex += 1;
      state.pending = null;
    } else {
      state.levelIndex += 1;
      state.stepIndex = 0;
      state.pending = null;
      state.mini = null;
      if (state.levelIndex >= ROLES[state.mode].levels.length) {
        finishGame();
        return;
      }
      initLevelMini();
    }

    persist();
    sfx('click');
    render({ scroll: true });
  }

  function applyEffects(effects) {
    if (!effects || !state) return;
    Object.entries(effects).forEach(([key, value]) => {
      if (typeof state.stats[key] === 'number') {
        state.stats[key] = clamp(state.stats[key] + value, 0, 100);
      }
    });
  }

  function toggleBlock(blockId) {
    if (!state || !state.mini || state.pending) return;
    const level = currentLevel();
    if (!level || level.type !== 'resume') return;
    const block = level.blocks.find((item) => item.id === blockId);
    if (!block) return;
    const selected = state.mini.selected;
    const index = selected.indexOf(blockId);
    if (index >= 0) {
      selected.splice(index, 1);
    } else {
      if (selected.length >= 4) {
        toast('В резюме помещается только 4 блока. Сначала убери один.');
        sfx('bad');
        return;
      }
      selected.push(blockId);
    }
    persist();
    sfx('click');
    render({ focus: `[data-block="${blockId}"]` });
  }

  function checkResume() {
    if (!state || !state.mini || state.pending) return;
    const level = currentLevel();
    if (!level || level.type !== 'resume') return;
    if (state.mini.selected.length !== 4) {
      toast('Выбери ровно 4 блока');
      return;
    }

    const blocks = state.mini.selected
      .map((id) => level.blocks.find((block) => block.id === id))
      .filter(Boolean);
    const effects = {};
    let quality = 0;
    blocks.forEach((block) => {
      quality += block.quality;
      Object.entries(block.effects || {}).forEach(([key, value]) => {
        effects[key] = (effects[key] || 0) + value;
      });
    });

    applyEffects(effects);
    state.quality += quality;
    state.history.push({
      level: level.title,
      short: quality >= 4 ? 'Сильное резюме' : quality >= 2 ? 'Рабочее резюме' : 'Резюме не сработало',
      quality,
      effects
    });
    state.pending = {
      type: 'resume',
      blocks,
      quality,
      effects,
      resultText: resumeOutcome(quality)
    };
    persist();
    sfx(quality >= 4 ? 'good' : quality >= 2 ? 'click' : 'bad');
    render({ focus: '.result-panel' });
  }

  function sortCandidate(decision) {
    if (!state || !state.mini || state.pending || busy) return;
    const level = currentLevel();
    if (!level || level.type !== 'sort') return;
    const candidate = level.candidates[state.mini.index];
    if (!candidate) return;

    busy = true;
    const card = $('.candidate-card');
    if (card) card.classList.add('leaving');
    const shortlist = decision === 'shortlist';

    window.setTimeout(() => {
      if (!state) {
        busy = false;
        return;
      }
      state.mini.decisions.push({
        name: candidate.name,
        shortlist,
        good: candidate.good,
        note: candidate.note
      });
      state.mini.index += 1;

      if (state.mini.index >= level.candidates.length) {
        finishSort(level);
      } else {
        persist();
        sfx('click');
        render();
      }
      busy = false;
    }, reduceMotion() ? 0 : 190);
  }

  function finishSort(level) {
    const decisions = state.mini.decisions;
    const total = level.candidates.length;
    const correct = decisions.filter((decision) => decision.shortlist === decision.good).length;
    const quality = correct * 2 - total;
    const effects = {
      time: -6,
      trust: Math.round((correct - total / 2) * 3),
      culture: Math.round((correct - total / 2) * 4)
    };

    applyEffects(effects);
    state.quality += quality;
    state.history.push({
      level: level.title,
      short: `Шортлист: ${correct} из ${total}`,
      quality,
      effects
    });
    state.pending = {
      type: 'sort',
      decisions: decisions.slice(),
      correct,
      total,
      quality,
      effects,
      resultText: sortOutcome(correct, total, decisions)
    };
    persist();
    sfx(correct >= total - 1 ? 'good' : correct >= total / 2 ? 'click' : 'bad');
    render({ focus: '.result-panel' });
  }

  function replay() {
    if (!lastResult) return;
    const mode = lastResult.mode;
    lastResult = null;
    startGame(mode);
  }

  function playOtherMode() {
    if (!lastResult) return;
    const mode = ROLES[lastResult.mode].opposite;
    lastResult = null;
    startGame(mode);
  }

  async function copyText(text) {
    try {
      await navigator.clipboard.writeText(text);
      return true;
    } catch (error) {
      try {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        document.body.appendChild(textarea);
        textarea.select();
        const ok = document.execCommand('copy');
        textarea.remove();
        return ok;
      } catch (fallbackError) {
        return false;
      }
    }
  }

  async function shareResult() {
    if (!lastResult) return;
    const role = ROLES[lastResult.mode];
    const url = window.location.href.split('#')[0];
    const text = `Я прошёл игру «Точка контакта» за ${role.label.toLowerCase()}: ${lastResult.score}/100 — «${lastResult.ending.badge}». Попробуй и ты:`;
    if (navigator.share) {
      try {
        await navigator.share({ title: 'Точка контакта', text, url });
        return;
      } catch (error) {
        /* user cancelled — fall back to copy */
      }
    }
    const copied = await copyText(`${text} ${url}`);
    toast(copied ? 'Результат скопирован' : 'Не получилось скопировать — ссылка в адресной строке');
  }

  /* ------------------------------------------------------------
     sound
  ------------------------------------------------------------ */
  let audioCtx = null;

  function ensureAudio() {
    if (audioCtx === false) return;
    if (!audioCtx) {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextClass) {
        audioCtx = false;
        return;
      }
      audioCtx = new AudioContextClass();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume().catch(() => {});
    }
  }

  function tone(freq, duration = 0.08, type = 'sine', volume = 0.035, delay = 0) {
    if (!soundOn) return;
    ensureAudio();
    if (!audioCtx || audioCtx === false) return;
    try {
      const start = audioCtx.currentTime + delay;
      const oscillator = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      oscillator.type = type;
      oscillator.frequency.setValueAtTime(freq, start);
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(volume, start + 0.012);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
      oscillator.connect(gain);
      gain.connect(audioCtx.destination);
      oscillator.start(start);
      oscillator.stop(start + duration + 0.02);
    } catch (error) {
      /* ignore */
    }
  }

  function sfx(name) {
    if (!soundOn) return;
    if (name === 'click') {
      tone(420, 0.055, 'sine', 0.03);
    } else if (name === 'start') {
      tone(330, 0.09, 'sine', 0.035);
      tone(440, 0.1, 'sine', 0.03, 0.07);
    } else if (name === 'good') {
      tone(523, 0.08, 'sine', 0.035);
      tone(659, 0.09, 'sine', 0.033, 0.06);
      tone(784, 0.1, 'sine', 0.03, 0.12);
    } else if (name === 'bad') {
      tone(196, 0.12, 'sawtooth', 0.025);
      tone(147, 0.14, 'sawtooth', 0.02, 0.08);
    } else if (name === 'win') {
      [523, 659, 784, 1047].forEach((freq, index) => tone(freq, 0.16, 'sine', 0.033, index * 0.1));
    } else if (name === 'lose') {
      [392, 330, 262].forEach((freq, index) => tone(freq, 0.2, 'sine', 0.028, index * 0.12));
    }
  }

  function updateSoundButton() {
    const button = $('#sound-toggle');
    if (!button) return;
    button.setAttribute('aria-pressed', soundOn ? 'true' : 'false');
    button.setAttribute('aria-label', soundOn ? 'Выключить звук' : 'Включить звук');
    button.title = soundOn ? 'Выключить звук' : 'Включить звук';
  }

  function toggleSound() {
    soundOn = !soundOn;
    try {
      localStorage.setItem(STORAGE.sound, soundOn ? 'on' : 'off');
    } catch (error) {
      /* ignore */
    }
    updateSoundButton();
    if (soundOn) {
      ensureAudio();
      sfx('click');
    }
    toast(soundOn ? 'Звук включён' : 'Звук выключен');
  }

  /* ------------------------------------------------------------
     toast + confetti
  ------------------------------------------------------------ */
  let toastTimer = null;

  function toast(message) {
    const element = $('#toast');
    if (!element) return;
    element.textContent = message;
    element.classList.add('show');
    window.clearTimeout(toastTimer);
    toastTimer = window.setTimeout(() => element.classList.remove('show'), 2400);
  }

  function launchConfetti() {
    if (reduceMotion()) return;
    const root = $('#confetti');
    if (!root) return;
    root.innerHTML = '';
    const colors = ['#8b7cff', '#c8ff6a', '#ff6fa5', '#ffb86b', '#ffffff'];
    for (let index = 0; index < 64; index += 1) {
      const piece = document.createElement('i');
      piece.style.left = `${Math.random() * 100}%`;
      piece.style.background = colors[index % colors.length];
      piece.style.animationDelay = `${Math.random() * 0.6}s`;
      piece.style.animationDuration = `${2.4 + Math.random() * 1.8}s`;
      piece.style.setProperty('--dx', `${(Math.random() * 2 - 1) * 30}vw`);
      piece.style.transform = `rotate(${Math.random() * 360}deg)`;
      if (index % 3 === 0) piece.style.borderRadius = '50%';
      root.appendChild(piece);
    }
    window.setTimeout(() => {
      root.innerHTML = '';
    }, 5200);
  }

  /* ------------------------------------------------------------
     background network canvas
  ------------------------------------------------------------ */
  function initCanvas() {
    const canvas = $('#net-canvas');
    if (!canvas) return;
    const context = canvas.getContext('2d');
    if (!context) return;
    let width = 0;
    let height = 0;
    let dpr = 1;
    let nodes = [];
    let frame = null;
    const still = reduceMotion();

    function makeNodes() {
      const count = Math.min(46, Math.max(18, Math.floor((width * height) / 32000)));
      nodes = Array.from({ length: count }, () => ({
        x: Math.random() * width,
        y: Math.random() * height,
        vx: (Math.random() - 0.5) * 0.18,
        vy: (Math.random() - 0.5) * 0.18,
        r: Math.random() * 1.5 + 0.6
      }));
    }

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = Math.floor(width * dpr);
      canvas.height = Math.floor(height * dpr);
      canvas.style.width = `${width}px`;
      canvas.style.height = `${height}px`;
      context.setTransform(dpr, 0, 0, dpr, 0, 0);
      makeNodes();
      if (still) draw();
    }

    function draw() {
      context.clearRect(0, 0, width, height);
      for (let i = 0; i < nodes.length; i += 1) {
        const a = nodes[i];
        for (let j = i + 1; j < nodes.length; j += 1) {
          const b = nodes[j];
          const dx = a.x - b.x;
          const dy = a.y - b.y;
          const distanceSquared = dx * dx + dy * dy;
          if (distanceSquared < 130 * 130) {
            const alpha = (1 - Math.sqrt(distanceSquared) / 130) * 0.17;
            context.strokeStyle = `rgba(139,124,255,${alpha})`;
            context.lineWidth = 1;
            context.beginPath();
            context.moveTo(a.x, a.y);
            context.lineTo(b.x, b.y);
            context.stroke();
          }
        }
      }
      nodes.forEach((node) => {
        context.beginPath();
        context.arc(node.x, node.y, node.r, 0, Math.PI * 2);
        context.fillStyle = 'rgba(180,170,255,.45)';
        context.fill();
      });
      if (!still) {
        nodes.forEach((node) => {
          node.x += node.vx;
          node.y += node.vy;
          if (node.x < 0 || node.x > width) node.vx *= -1;
          if (node.y < 0 || node.y > height) node.vy *= -1;
        });
        frame = window.requestAnimationFrame(draw);
      }
    }

    resize();
    if (!still) draw();
    window.addEventListener('resize', () => {
      if (frame) window.cancelAnimationFrame(frame);
      resize();
    });
  }

  /* ------------------------------------------------------------
     events
  ------------------------------------------------------------ */
  document.addEventListener('click', (event) => {
    const target = event.target.closest('[data-action]');
    if (!target) return;
    const action = target.dataset.action;

    if (action === 'home') {
      event.preventDefault();
      goHome();
    } else if (action === 'start') {
      requestStart(target.dataset.mode);
    } else if (action === 'continue') {
      continueGame();
    } else if (action === 'choose') {
      chooseOption(target.dataset.option);
    } else if (action === 'next') {
      nextStep();
    } else if (action === 'block') {
      toggleBlock(target.dataset.block);
    } else if (action === 'check-resume') {
      checkResume();
    } else if (action === 'sort') {
      sortCandidate(target.dataset.decision);
    } else if (action === 'share') {
      shareResult();
    } else if (action === 'replay') {
      replay();
    } else if (action === 'other-mode') {
      playOtherMode();
    } else if (action === 'toggle-sound') {
      toggleSound();
    }
  });

  document.addEventListener('keydown', (event) => {
    if (screen !== 'game' || !state || state.pending) return;
    if (event.key < '1' || event.key > '4') return;
    const level = currentLevel();
    if (!level || level.type === 'resume' || level.type === 'sort') return;
    const step = currentStep();
    if (!step || !step.options) return;
    const option = step.options[Number(event.key) - 1];
    if (option) {
      event.preventDefault();
      chooseOption(option.id);
    }
  });

  document.addEventListener('pointerdown', () => {
    if (soundOn) ensureAudio();
  }, { once: true });

  /* ------------------------------------------------------------
     boot
  ------------------------------------------------------------ */
  initCanvas();
  render();
})();

</script>
</body>
</html>
